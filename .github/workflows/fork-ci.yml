name: Fork CI

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      core: ${{ steps.filter.outputs.core }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select required gates
        id: filter
        env:
          BASE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          ui=false
          core=false

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            ui=true
            core=true
          else
            base="${BASE_SHA}"
            head="${HEAD_SHA}"

            if [[ "${EVENT_NAME}" == "pull_request" ]]; then
              base="${PR_BASE_SHA}"
              head="${PR_HEAD_SHA}"
            elif [[ "${base}" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              default_ref="refs/remotes/origin/${DEFAULT_BRANCH}"
              if [[ "${GITHUB_REF}" == "refs/heads/${DEFAULT_BRANCH}" ]]; then
                base=""
              elif git rev-parse --verify --quiet "${default_ref}^{commit}" >/dev/null; then
                base="$(git merge-base "${head}" "${default_ref}")"
              elif git rev-parse --verify --quiet "${head}^" >/dev/null; then
                base="${head}^"
              else
                base=""
              fi
            fi

            changed_file_list="${RUNNER_TEMP}/fork-ci-changed-files"
            if [[ -n "${base}" ]]; then
              if [[ "${EVENT_NAME}" == "pull_request" ]]; then
                git diff --name-only -z "${base}...${head}" > "${changed_file_list}"
              else
                git diff --name-only -z "${base}" "${head}" > "${changed_file_list}"
              fi
            else
              git ls-tree -r --name-only -z "${head}" > "${changed_file_list}"
            fi

            while IFS= read -r -d '' path; do
              case "${path}" in
                .github/workflows/fork-ci.yml)
                  ui=true
                  core=true
                  ;;
                tools/ui/*)
                  ui=true
                  ;;
                CMakeLists.txt|CMakePresets.json|cmake/*|common/*|ggml/*|include/*|src/*|tests/*|tools/server/*|vendor/*)
                  core=true
                  ;;
              esac
            done < "${changed_file_list}"
          fi

          echo "ui=${ui}" >> "${GITHUB_OUTPUT}"
          echo "core=${core}" >> "${GITHUB_OUTPUT}"

  ui:
    name: UI
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Client tests
        run: npm run test:client -- --run

      - name: Build Storybook
        run: npm run build-storybook

      - name: UI tests
        run: npm run test:ui -- --run --testTimeout=60000

      - name: End-to-end tests
        run: npm run test:e2e

  cpu-server:
    name: CPU and server
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libsqlite3-dev \
            libssl-dev \
            ninja-build

      - name: Configure
        run: |
          cmake -S . -B build-ci-cpu -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=ON

      - name: Build server and fork tests
        run: |
          cmake --build build-ci-cpu --target \
            llama-server \
            test-arg-parser \
            test-caliber-scoring \
            test-caliber-plan \
            test-model-registry \
            test-server-persistence \
            test-model-operations \
            test-streaming-profiler \
            test-quality-evidence \
            test-ds4-output-guard \
            test-least-cost-router \
            test-llama-archs \
            -j "$(nproc)"

      - name: Run fork tests
        run: |
          ctest --test-dir build-ci-cpu --output-on-failure \
            -R '^(test-arg-parser|caliber-scoring|caliber-plan|model-registry|server-persistence|model-operations|streaming-profiler|quality-evidence|ds4-output-guard|least-cost-router)$'

      - name: Qwen4Exp architecture smoke test
        run: build-ci-cpu/bin/test-llama-archs -a qwen4exp -v

  vulkan:
    name: Vulkan
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            glslc \
            libsqlite3-dev \
            libssl-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            ninja-build \
            spirv-headers \
            vulkan-tools

      - name: Configure
        run: |
          cmake -S . -B build-ci-vulkan -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_VULKAN=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=ON

      - name: Build server and architecture test
        run: cmake --build build-ci-vulkan --target llama-server test-llama-archs -j "$(nproc)"

      - name: Vulkan loader smoke test
        env:
          GGML_VK_VISIBLE_DEVICES: '0'
        run: |
          vulkaninfo --summary
          build-ci-vulkan/bin/llama-server --version
          build-ci-vulkan/bin/test-llama-archs -a qwen4exp -v

  cuda:
    name: CUDA compile (sm_86)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.6.2-devel-ubuntu24.04
    steps:
      - name: Install base dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            git

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libsqlite3-dev \
            libssl-dev \
            ninja-build

      - name: Configure
        run: |
          cmake -S . -B build-ci-cuda -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=86-real \
            -DGGML_CUDA=ON \
            -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF

      - name: Build server
        run: cmake --build build-ci-cuda --target llama-server -j "$(nproc)"
